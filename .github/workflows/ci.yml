name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check source files
        run: |
          node --check server.js
          for f in src/*.js; do node --check "$f"; done
          for f in public/*.js; do node --check "$f"; done

      - name: Run unit tests with coverage
        run: npm run coverage

      - name: Smoke test - server boots and serves the API
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/api/graph > /dev/null; then
              echo "Server responded successfully"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "Server did not respond in time"
              kill $SERVER_PID
              exit 1
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/scenarios > /dev/null
          kill $SERVER_PID

  update-coverage-badge:
    needs: build-and-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

      - name: Build badge JSON
        run: |
          node -e '
            const fs = require("fs");
            const pct = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total.lines.pct;
            const color = pct >= 90 ? "brightgreen" : pct >= 80 ? "green" : pct >= 70 ? "yellowgreen" : pct >= 60 ? "yellow" : pct >= 50 ? "orange" : "red";
            fs.mkdirSync("badge-output", { recursive: true });
            fs.writeFileSync("badge-output/coverage.json", JSON.stringify({
              schemaVersion: 1,
              label: "coverage",
              message: `${pct}%`,
              color,
            }, null, 2) + "\n");
          '

      - name: Publish badge to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin badges
          git worktree add /tmp/badges-branch origin/badges
          cp badge-output/coverage.json /tmp/badges-branch/coverage.json
          cd /tmp/badges-branch
          git checkout -B badges
          if git diff --quiet -- coverage.json; then
            echo "Coverage badge unchanged, skipping commit."
          else
            git add coverage.json
            git commit -m "Update coverage badge (${{ github.sha }})"
            git push origin badges
          fi
