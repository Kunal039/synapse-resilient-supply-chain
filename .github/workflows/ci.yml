name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check source files
        run: |
          node --check server.js
          for f in src/*.js; do node --check "$f"; done
          for f in public/*.js; do node --check "$f"; done

      - name: Smoke test - server boots and serves the API
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/api/graph > /dev/null; then
              echo "Server responded successfully"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "Server did not respond in time"
              kill $SERVER_PID
              exit 1
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/scenarios > /dev/null
          kill $SERVER_PID
